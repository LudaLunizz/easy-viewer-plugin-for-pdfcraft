name: CI

# The patch must apply to the PdfCraft commit it was made against (pinned in
# scripts/check-patch.sh). A weekly run also tries PdfCraft's current main, as an
# early warning that the patch needs a rebase.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned:
    name: Applies to the pinned PdfCraft commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-patch.sh pinned

  upstream-main:
    name: Applies to PdfCraft main (warning only)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-patch.sh main
